stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

cache:
  paths:
    - .cache/pip
    - .cache/npm
    - frontend/node_modules

backend-lint:
  stage: lint
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - pip install -r requirements.txt
    - ruff check .
    - mypy src/

backend-test:
  stage: test
  image: python:3.12-slim
  rules:
    - changes:
        - backend/**/*
  script:
    - cd backend
    - pip install -r requirements.txt
    - pytest -x -q --cov=src --cov-report=term --cov-report=xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

frontend-lint:
  stage: lint
  image: node:20-slim
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run typecheck

frontend-test:
  stage: test
  image: node:20-slim
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm test -- --run
